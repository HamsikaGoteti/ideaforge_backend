spring.application.name=ideaforge-backend-test
server.port=8081

# H2 In-Memory Database for automated tests
spring.datasource.url=jdbc:h2:mem:ideaforge_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test JWT
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=3600000

# Test AI
app.ai.provider=fallback
app.ai.model=test-model
app.ai.api-key=test-key
app.ai.api-url=http://localhost:8080/mock
app.ai.timeout-ms=5000

app.cors.allowed-origins=http://localhost:5173
