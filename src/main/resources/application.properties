spring.application.name=ideaforge-backend
server.port=${SERVER_PORT:8088}

# Datasource Configuration (MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ideaforge_app?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hamsika 2006}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security
# 256-bit secret key for HMAC-SHA256
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 24 hours token expiration
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AI Provider Configuration
# Supported providers: 'openai' (or OpenAI compatible REST API), 'gemini', 'fallback'
app.ai.provider=${AI_PROVIDER:fallback}
app.ai.model=${AI_MODEL:gpt-4o-mini}
app.ai.api-key=${AI_API_KEY:}
app.ai.api-url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
app.ai.timeout-ms=${AI_TIMEOUT_MS:15000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
